<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Safe Guard Helmet AR Guide</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;">

      <!-- HIRO MARKER -->
      <a-marker preset="hiro">

  <!-- HELMET BASE -->
  <a-cylinder
    position="0 0.25 0"
    radius="0.22"
    height="0.15"
    color="#1e90ff">
  </a-cylinder>

  <!-- HELMET TOP -->
  <a-sphere
    position="0 0.45 0"
    radius="0.27"
    color="#4682b4">
  </a-sphere>

  <!-- GUIDELINES PANEL (background) -->
  <a-plane
    position="0 0.9 0"
    rotation="-90 0 0"
    width="1.2"
    height="1.3"
    color="#ffffff"
    opacity="0.85">
  </a-plane>

  <!-- STEP 1 -->
  <a-text
    value="1. Wear the helmet properly"
    position="0 1.15 0.01"
    rotation="-90 0 0"
    align="center"
    color="#000000"
    width="1"
    scale="0.7 0.7 0.7">
  </a-text>

  <!-- STEP 2 -->
  <a-text
    value="2. Fasten the chin strap securely"
    position="0 1.0 0.01"
    rotation="-90 0 0"
    align="center"
    color="#000000"
    width="1"
    scale="0.7 0.7 0.7">
  </a-text>

  <!-- STEP 3 -->
  <a-text
    value="3. Check sensors before use"
    position="0 0.85 0.01"
    rotation="-90 0 0"
    align="center"
    color="#000000"
    width="1"
    scale="0.7 0.7 0.7">
  </a-text>

  <!-- STEP 4 -->
  <a-text
    value="4. Do not use a damaged helmet"
    position="0 0.7 0.01"
    rotation="-90 0 0"
    align="center"
    color="#000000"
    width="1"
    scale="0.7 0.7 0.7">
  </a-text>

</a-marker>


      <!-- CAMERA -->
      <a-entity camera></a-entity>

    </a-scene>
  </body>
</html>
