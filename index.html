<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Safe Guard Helmet AR Simulation</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <script>
    AFRAME.registerComponent('helmet-steps', {
      init: function () {
        const marker = this.el;

        const helmet = marker.querySelector('#helmet');
        const strap = marker.querySelector('#strap');
        const text = marker.querySelector('#text');

        let step = 0;

        setInterval(() => {
          step = (step + 1) % 4;

          // STEP 1: Wear helmet
          if (step === 0) {
            text.setAttribute('value', '1. WEAR THE HELMET PROPERLY');
            text.setAttribute('color', 'red');
            helmet.setAttribute('position', '-0.5 0.4 0');
            strap.setAttribute('visible', false);
            helmet.setAttribute('material', 'color:#1e90ff');
          }

          // STEP 2: Fasten strap
          if (step === 1) {
            text.setAttribute('value', '2. FASTEN THE CHIN STRAP');
            text.setAttribute('color', 'yellow');
            strap.setAttribute('visible', true);
          }

          // STEP 3: Check sensors
          if (step === 2) {
            text.setAttribute('value', '3. CHECKING SENSORS...');
            text.setAttribute('color', 'orange');
            helmet.setAttribute('material', 'color:#00ff00');
          }

          // STEP 4: Warning
          if (step === 3) {
            text.setAttribute('value', '4. DAMAGED HELMET - DO NOT USE');
            text.setAttribute('color', 'green');
            helmet.setAttribute('material', 'color:red');
          }

        }, 3000);
      }
    });
  </script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>

<body>
<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

  <a-marker preset="hiro" helmet-steps>

    <!-- HELMET -->
    <a-entity id="helmet"
      position="-0.5 0.3 0"
      rotation="0 90 0"
      scale="0.6 0.6 0.6">

      <a-cylinder radius="0.25" height="0.18" color="#1e90ff"></a-cylinder>
      <a-sphere position="0 0.15 0" radius="0.28" color="#4682b4"></a-sphere>

    </a-entity>

    <!-- STRAP -->
    <a-cylinder id="strap"
      position="-0.5 0.1 0.2"
      radius="0.02"
      height="0.3"
      color="black"
      visible="false">
    </a-cylinder>

    <!-- TEXT -->
    <a-text id="text"
      value="1. WEAR THE HELMET PROPERLY"
      position="0.4 1.2 0"
      align="center"
      color="red"
      width="3"
      scale="1.5 1.5 1.5">
    </a-text>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>
</body>
</html>
