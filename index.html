<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Helmet AR Safety Guide</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>

<body>
<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

  <a-marker preset="hiro">

    <!-- HEAD -->
    <a-sphere
      position="0 0.5 0"
      radius="0.25"
      color="#f2c9ac">
    </a-sphere>

    <!-- STRAP (STABLE & ALWAYS VISIBLE) -->
    <a-torus
      position="0 0.43 0"
      rotation="90 0 0"
      radius="0.29"
      radius-tubular="0.03"
      color="#111111">
    </a-torus>

    <!-- GREEN HELMET (SAFE) -->
    <a-entity
      position="0 0.75 0"
      rotation="-90 0 180"
      scale="0.6 0.6 0.6"
      visible="true">

      <a-cylinder
        radius="0.28"
        height="0.2"
        material="color:#00ff00; emissive:#00ff00; emissiveIntensity:1">
      </a-cylinder>

      <a-sphere
        position="0 0.15 0"
        radius="0.3"
        material="color:#00ff00; emissive:#00ff00; emissiveIntensity:1">
      </a-sphere>

      <a-animation
        attribute="visible"
        from="true"
        to="false"
        begin="6000"
        dur="1">
      </a-animation>

    </a-entity>

    <!-- RED HELMET (UNSAFE) -->
    <a-entity
      position="0 0.75 0"
      rotation="-90 0 180"
      scale="0.6 0.6 0.6"
      visible="false">

      <a-cylinder
        radius="0.28"
        height="0.2"
        material="color:#ff0000; emissive:#ff0000; emissiveIntensity:1.2">
      </a-cylinder>

      <a-sphere
        position="0 0.15 0"
        radius="0.3"
        material="color:#ff0000; emissive:#ff0000; emissiveIntensity:1.2">
      </a-sphere>

      <a-animation
        attribute="visible"
        from="false"
        to="true"
        begin="6000"
        dur="1">
      </a-animation>

    </a-entity>

    <!-- TEXT -->
    <a-text
      value="STEP 3: HELMET SAFE"
      position="0 1.35 0"
      align="center"
      color="green"
      width="4"
      scale="2 2 2">
    </a-text>

    <a-text
      value="STEP 4: DO NOT USE DAMAGED HELMET"
      position="0 1.05 0"
      align="center"
      color="red"
      width="4"
      scale="2 2 2">
    </a-text>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>
</body>
</html>
