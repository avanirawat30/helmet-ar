<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Helmet AR Simulation</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>

<body>
<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

  <a-marker preset="hiro">

    <!-- HEAD -->
    <a-sphere position="0 0.5 0" radius="0.25" color="#f2c9ac"></a-sphere>

    <!-- HELMET -->
    <a-entity position="0 0.75 0" rotation="-90 0 180" scale="0.6 0.6 0.6">
      <a-cylinder radius="0.28" height="0.2" color="#1e90ff"></a-cylinder>
      <a-sphere position="0 0.15 0" radius="0.3" color="#4682b4"></a-sphere>
    </a-entity>

    <!-- STEP 1 -->
    <a-text
      value="1. Wear the helmet properly"
      position="0 1.3 0"
      align="center"
      color="red"
      width="4"
      scale="2 2 2"
      visible="false"
      animation__show="property: visible; from: false; to: true; startEvents: markerFound; delay: 0; dur: 1"
      animation__hide="property: visible; from: true; to: false; startEvents: markerFound; delay: 4000; dur: 1; loop: true">
    </a-text>

    <!-- STEP 2 -->
    <a-text
      value="2. Fasten the chin strap securely"
      position="0 1.3 0"
      align="center"
      color="orange"
      width="4"
      scale="2 2 2"
      visible="false"
      animation__show="property: visible; from: false; to: true; startEvents: markerFound; delay: 4000; dur: 1; loop: true"
      animation__hide="property: visible; from: true; to: false; startEvents: markerFound; delay: 8000; dur: 1; loop: true">
    </a-text>

    <!-- STEP 3 -->
    <a-text
      value="3. Helmet ready and safe to use"
      position="0 1.3 0"
      align="center"
      color="green"
      width="4"
      scale="2 2 2"
      visible="false"
      animation__show="property: visible; from: false; to: true; startEvents: markerFound; delay: 8000; dur: 1; loop: true"
      animation__hide="property: visible; from: true; to: false; startEvents: markerFound; delay: 12000; dur: 1; loop: true">
    </a-text>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>
</body>
</html>
