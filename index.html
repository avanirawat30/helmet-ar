<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Helmet AR User Guide</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>
<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

  <!-- HIRO MARKER -->
  <a-marker preset="hiro">

    <!-- HUMAN HEAD -->
    <a-sphere
      position="0 0.5 0"
      radius="0.25"
      color="#f2c9ac">
    </a-sphere>

    <!-- HELMET (UPWARD, ON HEAD) -->
    <a-entity
      position="0 0.75 0"
      rotation="-90 0 0"
      scale="0.6 0.6 0.6">

      <!-- Helmet base -->
      <a-cylinder
        radius="0.28"
        height="0.2"
        color="#00ff00"
        material="emissive:#00ff00; emissiveIntensity:1">
      </a-cylinder>

      <!-- Helmet dome -->
      <a-sphere
        position="0 0.15 0"
        radius="0.3"
        color="#00ff00"
        material="emissive:#00ff00; emissiveIntensity:1">
      </a-sphere>

    </a-entity>

    <!-- INSTRUCTIONS (BIG & CLEAR) -->
    <a-text
      value="SAFE HELMET CONDITION"
      position="0 1.4 0"
      align="center"
      color="green"
      width="4"
      scale="2 2 2">
    </a-text>

    <a-text
      value="1. Wear helmet properly"
      position="0 1.1 0"
      align="center"
      color="yellow"
      width="4"
      scale="1.5 1.5 1.5">
    </a-text>

    <a-text
      value="2. Fasten chin strap"
      position="0 0.9 0"
      align="center"
      color="orange"
      width="4"
      scale="1.5 1.5 1.5">
    </a-text>

    <a-text
      value="3. Check sensors before use"
      position="0 0.7 0"
      align="center"
      color="red"
      width="4"
      scale="1.5 1.5 1.5">
    </a-text>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>
</body>
</html>
