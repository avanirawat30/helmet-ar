<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Helmet AR User Guide</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>

<body>
<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

  <a-marker preset="hiro">

    <!-- HUMAN HEAD -->
    <a-sphere
      position="0 0.5 0"
      radius="0.25"
      color="#f2c9ac">
    </a-sphere>

    <!-- STRAP (ALWAYS VISIBLE) -->
    <a-torus
      position="0 0.45 0"
      rotation="90 0 0"
      radius="0.28"
      radius-tubular="0.025"
      color="#000000">
    </a-torus>

    <!-- SAFE HELMET (GREEN) -->
    <a-entity
      position="-0.35 0.75 0"
      rotation="-90 0 0"
      scale="0.5 0.5 0.5">

      <a-cylinder
        radius="0.28"
        height="0.2"
        material="color:#00ff00; emissive:#00ff00; emissiveIntensity:1">
      </a-cylinder>

      <a-sphere
        position="0 0.15 0"
        radius="0.3"
        material="color:#00ff00; emissive:#00ff00; emissiveIntensity:1">
      </a-sphere>
    </a-entity>

    <!-- UNSAFE HELMET (RED) -->
    <a-entity
      position="0.35 0.75 0"
      rotation="-90 0 0"
      scale="0.5 0.5 0.5">

      <a-cylinder
        radius="0.28"
        height="0.2"
        material="color:#ff0000; emissive:#ff0000; emissiveIntensity:1.2">
      </a-cylinder>

      <a-sphere
        position="0 0.15 0"
        radius="0.3"
        material="color:#ff0000; emissive:#ff0000; emissiveIntensity:1.2">
      </a-sphere>
    </a-entity>

    <!-- LABELS -->
    <a-text
      value="SAFE HELMET"
      position="-0.35 1.2 0"
      align="center"
      color="green"
      width="3"
      scale="1.5 1.5 1.5">
    </a-text>

    <a-text
      value="UNSAFE HELMET"
      position="0.35 1.2 0"
      align="center"
      color="red"
      width="3"
      scale="1.5 1.5 1.5">
    </a-text>

    <a-text
      value="Wear helmet properly • Fasten strap • Check condition"
      position="0 1.5 0"
      align="center"
      color="yellow"
      width="5"
      scale="1.6 1.6 1.6">
    </a-text>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>
</body>
</html>
