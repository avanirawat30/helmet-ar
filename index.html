<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Safe Guard Helmet AR User Guide</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script>
      AFRAME.registerComponent('step-switcher', {
        init: function () {
          const steps = [
            document.querySelector('#step1'),
            document.querySelector('#step2'),
            document.querySelector('#step3'),
            document.querySelector('#step4')
          ];

          let current = 0;

          // Hide all except first
          steps.forEach((s, i) => {
            s.setAttribute('visible', i === 0);
          });

          setInterval(() => {
            steps[current].setAttribute('visible', false);
            current = (current + 1) % steps.length;
            steps[current].setAttribute('visible', true);
          }, 3000); // change every 3 seconds
        }
      });
    </script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;">

      <!-- HIRO MARKER -->
      <a-marker preset="hiro" step-switcher>

        <!-- HELMET (SIDE VIEW - SAME AS BEFORE) -->
        <a-entity
          position="-0.5 0.3 0"
          rotation="0 90 0"
          scale="0.6 0.6 0.6">

          <a-cylinder
            radius="0.25"
            height="0.18"
            color="#1e90ff">
          </a-cylinder>

          <a-sphere
            position="0 0.15 0"
            radius="0.28"
            color="#4682b4">
          </a-sphere>

        </a-entity>

        <!-- STEP 1 -->
        <a-text
          id="step1"
          value="1. Wear the helmet properly"
          position="0.4 1.2 0"
          align="center"
          color="#ff0000"
          width="1.3">
        </a-text>

        <!-- STEP 2 -->
        <a-text
          id="step2"
          value="2. Fasten the chin strap securely"
          position="0.4 1.2 0"
          align="center"
          color="#000000"
          width="1.3">
        </a-text>

        <!-- STEP 3 -->
        <a-text
          id="step3"
          value="3. Check sensors before use"
          position="0.4 1.2 0"
          align="center"
          color="#000000"
          width="1.3">
        </a-text>

        <!-- STEP 4 -->
        <a-text
          id="step4"
          value="4. Do not use a damaged helmet"
          position="0.4 1.2 0"
          align="center"
          color="#000000"
          width="1.3">
        </a-text>

      </a-marker>

      <!-- CAMERA -->
      <a-entity camera></a-entity>

    </a-scene>
  </body>
</html>
