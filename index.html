<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Helmet AR Simulation</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>

<body>

<a-scene
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false;">

  <a-marker preset="hiro">

    <!-- HEAD -->
    <a-sphere
      position="0 0.5 0"
      radius="0.25"
      color="#f2c9ac"
      rotation="-10 0 0">
    </a-sphere>

    <!-- HELMET -->
    <a-entity
      position="0 0.75 0"
      rotation="-75 0 180"
      scale="0.6 0.6 0.6">

      <a-cylinder
        radius="0.28"
        height="0.2"
        color="#1e90ff">
      </a-cylinder>

      <a-sphere
        position="0 0.15 0"
        radius="0.3"
        color="#4682b4">
      </a-sphere>

    </a-entity>

    <!-- INSTRUCTION TEXT (REDUCED FONT MORE) -->
    <a-text
      id="instructionText"
      value="1. Wear the helmet properly"
      position="0 1.35 0"
      align="center"
      color="red"
      width="4"
      scale="1.4 1.4 1.4">
    </a-text>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  window.addEventListener('load', () => {

    const steps = [
      { text: "1. Wear the helmet properly", color: "red" },
      { text: "2. Fasten the chin strap securely", color: "yellow" },
      { text: "3. Helmet ready and safe to use", color: "green" }
    ];

    let index = 0;
    const textEl = document.querySelector('#instructionText');

    setInterval(() => {
      index = (index + 1) % steps.length;
      textEl.setAttribute('value', steps[index].text);
      textEl.setAttribute('color', steps[index].color);
    }, 3000);

  });
</script>

</body>
</html>
