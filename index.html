<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Safe Guard Helmet AR Guide</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;">

      <!-- HIRO MARKER -->
      <a-marker preset="hiro">

        <!-- VISUAL ICON (Helmet Representation) -->
        <a-cylinder
          position="0 0.3 0"
          radius="0.25"
          height="0.2"
          color="#1e90ff">
        </a-cylinder>

        <!-- Helmet Top -->
        <a-sphere
          position="0 0.5 0"
          radius="0.3"
          color="#4682b4">
        </a-sphere>

        <!-- STEP 1 -->
        <a-text
          value="STEP 1:\nWear the helmet properly"
          position="0 1.1 0"
          rotation="-90 0 0"
          align="center"
          color="red"
          scale="0.8 0.8 0.8">
        </a-text>

        <!-- STEP 2 -->
        <a-text
          value="STEP 2:\nFasten the chin strap securely"
          position="0 0.9 0"
          rotation="-90 0 0"
          align="center"
          color="black"
          scale="0.7 0.7 0.7">
        </a-text>

        <!-- STEP 3 -->
        <a-text
          value="STEP 3:\nCheck sensors before operation"
          position="0 0.7 0"
          rotation="-90 0 0"
          align="center"
          color="black"
          scale="0.7 0.7 0.7">
        </a-text>

        <!-- STEP 4 -->
        <a-text
          value="STEP 4:\nDo not use damaged helmet"
          position="0 0.5 0"
          rotation="-90 0 0"
          align="center"
          color="black"
          scale="0.7 0.7 0.7">
        </a-text>

      </a-marker>

      <!-- CAMERA -->
      <a-entity camera></a-entity>

    </a-scene>
  </body>
</html>
